apiVersion: v1
kind: ConfigMap
metadata:
  name: easytravel-config
  namespace: easytravel
  labels:
    app.kubernetes.io/name: easytravel
    app.kubernetes.io/part-of: easytravel-platform
data:
  # Eureka Discovery
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  Eureka__Client__ServiceUrl: "http://eureka-server:8761/eureka/"
  
  # Redis Config
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  
  # Internal Service URLs
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084/api/notifications"
  API_GATEWAY_URL: "http://api-gateway:8080/api"
  
  # .NET Logging Service Config
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8086"
---
apiVersion: v1
kind: Secret
metadata:
  name: easytravel-secret
  namespace: easytravel
  labels:
    app.kubernetes.io/name: easytravel
    app.kubernetes.io/part-of: easytravel-platform
