# ─── .NET Logging Service ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: easytravel
  labels:
    app.kubernetes.io/name: logging-service
    app.kubernetes.io/part-of: easytravel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: easytravel/logging-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: easytravel-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: easytravel-config
                  key: ASPNETCORE_URLS
            - name: Eureka__Client__ServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: easytravel-config
                  key: Eureka__Client__ServiceUrl
          volumeMounts:
            - name: logging-data
              mountPath: /app/logs
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
      volumes:
        - name: logging-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: easytravel
  labels:
    app.kubernetes.io/name: logging-service
    app.kubernetes.io/part-of: easytravel-platform
spec:
  type: ClusterIP
  selector:
    app: logging-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
# ─── AI Chatbot Service (FastAPI) ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: easytravel
  labels:
    app.kubernetes.io/name: chatbot-service
    app.kubernetes.io/part-of: easytravel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: easytravel/chatbot-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: easytravel-secret
                  key: GEMINI_API_KEY
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: easytravel-secret
                  key: OPENWEATHER_API_KEY
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: easytravel-config
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/chat/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/chat/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: easytravel
  labels:
    app.kubernetes.io/name: chatbot-service
    app.kubernetes.io/part-of: easytravel-platform
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
