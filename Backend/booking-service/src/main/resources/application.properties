server.port=8082

spring.application.name=booking-service
spring.cache.type=none

spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.connection.isolation=4

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Notification Service REST URL (Eureka Service Discovery Name)
notification.service.url=http://notification-service/api/notifications

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


logging.level.com.busbooking=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# -------------------------------------------------------
# Resilience4j Circuit Breaker Configuration
# -------------------------------------------------------
# notificationService: guards calls to notification-service (ticket, cancellation emails)
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.notificationService.slowCallDurationThreshold=5s
resilience4j.circuitbreaker.instances.notificationService.slowCallRateThreshold=80

# walletService: guards calls to auth-service wallet endpoints (deduct/add)
resilience4j.circuitbreaker.instances.walletService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.walletService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.walletService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.walletService.slowCallDurationThreshold=5s
resilience4j.circuitbreaker.instances.walletService.slowCallRateThreshold=80
