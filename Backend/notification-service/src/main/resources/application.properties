server.port=8084

spring.application.name=notification-service


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# -------------------------------------------------------
# Resilience4j Circuit Breaker Configuration
# -------------------------------------------------------
# bookingService: guards calls to booking-service (fetch contact emails)
resilience4j.circuitbreaker.instances.bookingService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bookingService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookingService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bookingService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.bookingService.slowCallDurationThreshold=5s
resilience4j.circuitbreaker.instances.bookingService.slowCallRateThreshold=80
