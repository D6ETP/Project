server.port=8080
spring.application.name=api-gateway

# CORS Configuration
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[2]=http://localhost:5174
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[3]=http://localhost:5175
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[4]=http://localhost:30080
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[5]=http://localhost
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[0].filters[1]=RewritePath=/api/auth/(?<segment>.*), /auth/$\\{segment}

# Public Routes — Routes
spring.cloud.gateway.server.webflux.routes[1].id=booking-routes-public
spring.cloud.gateway.server.webflux.routes[1].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/routes, /api/routes/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[1].filters[1]=RewritePath=/api/routes(?<segment>.*), /routes$\\{segment}

# Public Routes — Seats
spring.cloud.gateway.server.webflux.routes[2].id=booking-seats-public
spring.cloud.gateway.server.webflux.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/seats, /api/seats/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[2].filters[1]=RewritePath=/api/seats(?<segment>.*), /seats$\\{segment}

# Public Routes — Reviews
spring.cloud.gateway.server.webflux.routes[3].id=booking-reviews-public
spring.cloud.gateway.server.webflux.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reviews, /api/reviews/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[3].filters[1]=RewritePath=/api/reviews(?<segment>.*), /reviews$\\{segment}

# Protected Routes — Bookings
spring.cloud.gateway.server.webflux.routes[4].id=booking-bookings
spring.cloud.gateway.server.webflux.routes[4].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[4].filters[1]=RewritePath=/api/bookings/(?<segment>.*), /bookings/$\\{segment}

# Admin Routes
spring.cloud.gateway.server.webflux.routes[5].id=admin-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://admin-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[5].filters[1]=RewritePath=/api/(?<segment>.*), /$\\{segment}

# Logging Service
spring.cloud.gateway.server.webflux.routes[6].id=logging-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://logging-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/logs/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/api/(?<segment>.*), /$\\{segment}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health, info
